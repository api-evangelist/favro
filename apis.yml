aid: favro
name: Favro
description: 'Favro is a cloud planning and collaboration platform for agile teams, combining
  planning boards, backlogs, sprint/kanban widgets, roadmaps, and OKR/portfolio management
  in a single organization-scoped workspace. Its public REST API (https://favro.com/api/v1)
  exposes organizations, collections, widgets, columns, cards, tasks, tasklists, comments,
  tags, custom fields, groups, users, and webhooks, authenticated with HTTP Basic auth
  using an email plus a revocable API token. The API supports request-id cursor pagination,
  per-plan token-bucket rate limiting with X-RateLimit-* headers, backend-affinity routing
  via the X-Favro-Backend-Identifier header, outbound webhooks for card and comment events,
  and SCIM 1.1/2.0 user and group provisioning. Favro is SaaS, backed by Creandum.'
